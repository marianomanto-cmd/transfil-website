<body>
<div id="root"></div>

<!-- React + Babel pinned with integrity -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Module files (order matters) -->
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="i18n.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="sections.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

// Default tweak values — wrapped in EDITMODE markers so the host can rewrite
// them on disk when the user persists changes from the Tweaks panel.
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "lang": "es",
  "heroVariant": "type",
  "clientsVariant": "marquee",
  "accent": "#3a86ff",
  "heroBg": "img\/hf-welder.png",
  "servicesVariant": "rows",
  "processVariant": "hotspots"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const content = window.TF_CONTENT[t.lang] || window.TF_CONTENT.es;

  // Sync html lang for accessibility / native form locale
  useEffect(() => { document.documentElement.lang = t.lang; }, [t.lang]);

  // Apply the chosen accent to CSS custom properties so every instance
  // (CTAs, eyebrows, focus rings, timeline dots) updates from one source.
  useEffect(() => {
    document.documentElement.style.setProperty('--accent', t.accent);
    // Compute a translucent "soft" version of the accent for backgrounds.
    const hex = t.accent.replace('#', '');
    const r = parseInt(hex.slice(0, 2), 16);
    const g = parseInt(hex.slice(2, 4), 16);
    const b = parseInt(hex.slice(4, 6), 16);
    document.documentElement.style.setProperty('--accent-soft', `rgba(${r},${g},${b},0.12)`);
  }, [t.accent]);

  return (
    <>
      <TFHeader lang={t.lang} setLang={(l) => setTweak('lang', l)} content={content} />
      <main>
        <TFHero content={content} variant={t.heroVariant} bgUrl={t.heroBg} />
        <TFTechSection content={content} />
        <TFCatalogsSection content={content} />
        <TFProcessStrip lang={t.lang} variant={t.processVariant} />
        <TFServicesSection content={content} variant={t.servicesVariant} />
        <TFIndustriesSection content={content} clientsVariant={t.clientsVariant} />
        <TFHistorySection content={content} />
        <TFContactSection content={content} />
      </main>
      <TFFooter content={content} />
      <TFWhatsAppFAB />

      <TweaksPanel title="Trans-Fil · Tweaks">
        <TweakSection label="Language">
          <TweakRadio label="Locale" value={t.lang}
                      options={[{value:'es',label:'ES'}, {value:'en',label:'EN'}]}
                      onChange={(v) => setTweak('lang', v)} />
        </TweakSection>
        <TweakSection label="Hero">
          <TweakRadio label="Style" value={t.heroVariant}
                      options={[
                        {value:'type', label:'Type'},
                        {value:'split', label:'Split'},
                        {value:'video', label:'Video'},
                      ]}
                      onChange={(v) => setTweak('heroVariant', v)} />
          <TweakSelect label="Background" value={t.heroBg}
                       options={[
                         {value:'img/hf-welder.png', label:'HF welder + refrigerante'},
                         {value:'img/welding-line.avif', label:'Línea de soldadura'},
                         {value:'img/conveyor-blue.avif', label:'Transportador azul'},
                         {value:'img/hydraulic-station.avif', label:'Central hidráulica'},
                         {value:'img/hydraulic-station-2.avif', label:'Central hidráulica 2'},
                         {value:'img/control-cabinet.avif', label:'Tablero de control'},
                         {value:'img/gearbox-detail.avif', label:'Detalle de reductor'},
                         {value:'img/washing-line.avif', label:'Línea de lavado'},
                         {value:'', label:'Sin fondo (solo grilla)'},
                       ]}
                       onChange={(v) => setTweak('heroBg', v)} />
        </TweakSection>
        <TweakSection label="Clients section">
          <TweakRadio label="Style" value={t.clientsVariant}
                      options={[
                        {value:'marquee', label:'Marquee'},
                        {value:'list', label:'List'},
                      ]}
                      onChange={(v) => setTweak('clientsVariant', v)} />
        </TweakSection>
        <TweakSection label="Process section">
          <TweakSelect label="Layout" value={t.processVariant}
                       options={[
                         {value:'minimal', label:'Minimal (sin foto)'},
                         {value:'hotspots', label:'Hotspots (foto + cards)'},
                         {value:'banner', label:'Banner (foto arriba)'},
                         {value:'perStep', label:'Foto por paso'},
                       ]}
                       onChange={(v) => setTweak('processVariant', v)} />
        </TweakSection>
        <TweakSection label="Services section">
          <TweakSelect label="Layout" value={t.servicesVariant}
                       options={[
                         {value:'grid', label:'Grid (4 cards)'},
                         {value:'rows', label:'Rows (filas alternadas)'},
                         {value:'clean', label:'Clean (sin foto)'},
                       ]}
                       onChange={(v) => setTweak('servicesVariant', v)} />
        </TweakSection>
        <TweakSection label="Accent color">
          <TweakColor label="Accent" value={t.accent}
                      options={['#3a86ff', '#ff6b1a', '#f5d000', '#e63946', '#9ca3af']}
                      onChange={(v) => setTweak('accent', v)} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
